# splat config for the boot loader (SCES_028.73). UNTESTED starting point:
# run `splat split config/splat.loader.yaml` after installing splat
# (pip install splat64[mips]) and adjust to your splat version's schema.
name: SCES_028.73
sha1: ""   # fill in from assets/disc/manifest.json
options:
  basename: loader
  target_path: assets/disc/SCES_028.73
  base_path: .
  platform: psx
  compiler: GCC
  asm_path: asm/loader
  src_path: src/loader
  build_path: build/loader
  ld_script_path: build/loader.ld
  find_file_boundaries: yes
segments:
  # PS-X EXE header is 0x800 bytes; code loads at 0x80010000 (from the header).
  - name: loader
    type: code
    start: 0x800
    vram: 0x80010000
    subsegments:
      - [0x800, asm]
  - [0x7000]
