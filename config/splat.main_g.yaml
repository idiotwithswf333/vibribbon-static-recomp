# splat config for the main game executable (MAIN_G.EXE). UNTESTED starting
# point: adjust to your splat version's schema.
name: MAIN_G.EXE
sha1: ""   # fill in from assets/disc/manifest.json
options:
  basename: main_g
  target_path: assets/disc/MAIN_G.EXE
  base_path: .
  platform: psx
  compiler: GCC
  asm_path: asm/main_g
  src_path: src/main_g
  build_path: build/main_g
  ld_script_path: build/main_g.ld
  find_file_boundaries: yes
segments:
  # PS-X EXE header is 0x800 bytes; code loads at 0x80019000 (from the header).
  - name: main_g
    type: code
    start: 0x800
    vram: 0x80019000
    subsegments:
      - [0x800, asm]
  - [0x5E000]
